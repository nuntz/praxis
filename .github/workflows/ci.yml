name: CI

on:
  push:
    branches: [master]
  pull_request:

# Every action is pinned by commit SHA, with its version beside it; Dependabot bumps both
# (.github/dependabot.yml).

# Only the deploy job adds `id-token: write`, to sign in to Pulumi Cloud through OIDC.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The last release, which lint/released.ts holds the hashes of the upgrade steps and of the
      # stored shapes' fixtures to.
      RELEASED_AT: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Fetch the last release
        if: ${{ !startsWith(env.RELEASED_AT, '0000000') }}
        run: git fetch --no-tags --depth=1 origin "$RELEASED_AT"
      - name: Guards still fire (lint rules, the registry guard, the upgrade steps, the stored shapes)
        run: bun run test:lint
      - name: The deploy's own code (infra, the wizard's scripts)
        run: bun run test:deploy
      - name: No placeholder names a closed ticket
        run: bun run check:tickets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Domain package (bun test)
        run: bun run test:domain
      - name: PWA (bun test)
        run: bun run test:pwa
      - name: Context object (Vitest in workerd)
        run: bun run test:worker

  # The browser journeys run beside the checks and do not hold the deploy back: a screen that
  # breaks is seen on the next visit and mended by the next push, while what a deploy cannot undo,
  # the upgrade of the stored tables, is held by the checks above (section 13). Each journey runs
  # once, and once more if it fails, so one that passes on its retry is reported flaky, not red.
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Browser journeys (Playwright, desktop and phone)
        run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  # A Deployment's values live in Pulumi ESC (section 12, docs/deployment.md). `bun run wizard` sets
  # up the secrets and variables this job reads; until then, and on a fork, it is skipped. The logs
  # are public, so every configuration value is masked before anything runs. Pulumi Cloud trusts
  # only this job on a push to master, so a run started by hand only tests.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && vars.PULUMI_STACK != ''
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Pulumi runs infra/index.ts on Node, which must strip its types itself to load its imports.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: 3.272.0

      # The stack and its organization are fine to show. PULUMI_CI_USER is a secret, so GitHub
      # masks it everywhere.
      - name: Check the CI user and read the organization
        id: names
        env:
          PULUMI_STACK: ${{ vars.PULUMI_STACK }}
          PULUMI_CI_USER: ${{ secrets.PULUMI_CI_USER }}
        run: |
          if [ -z "$PULUMI_CI_USER" ]; then
            echo "::error::The PULUMI_CI_USER secret is not set: run 'bun run wizard' (docs/deployment.md)"
            exit 1
          fi
          echo "organization=${PULUMI_STACK%%/*}" >> "$GITHUB_OUTPUT"

      # Exchanges this job's GitHub ID token for a personal token of PULUMI_CI_USER, exported as
      # PULUMI_ACCESS_TOKEN; the action masks both. Pulumi Cloud grants it only to this job on a
      # push to master (scripts/trust-pulumi-ci.ts). A first deploy runs `pulumi up` twice: half an
      # hour leaves room, as a token that expires mid-`pulumi up` leaves the stack locked.
      - name: Sign in to Pulumi Cloud through OIDC
        uses: pulumi/auth-actions@273044cc19e63ea565285da8edd4e059126a0bdb # v2.1.2
        with:
          organization: ${{ steps.names.outputs.organization }}
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:${{ secrets.PULUMI_CI_USER }}
          token-expiration: 1800

      - name: Select the stack and its ESC environment
        working-directory: infra
        env:
          PULUMI_STACK: ${{ vars.PULUMI_STACK }}
          PULUMI_ESC_ENVIRONMENT: ${{ vars.PULUMI_ESC_ENVIRONMENT }}
          PULUMI_CI_USER: ${{ secrets.PULUMI_CI_USER }}
        run: |
          if [ "$(pulumi whoami)" != "$PULUMI_CI_USER" ]; then
            echo "::error::Signed in to Pulumi Cloud as someone other than PULUMI_CI_USER"
            exit 1
          fi
          pulumi stack select "$PULUMI_STACK"
          pulumi config env add "$PULUMI_ESC_ENVIRONMENT" --yes > /dev/null
          pulumi config --show-secrets --json | jq -r '.. | strings | select(length >= 4)' |
            while IFS= read -r value; do echo "::add-mask::$value"; done

      # A deploy is a one-way door once any object wakes under it (ADR 0019): it stops before
      # anything changes when the Backup the daily trigger was last due to make is not in the
      # bucket, unless the head commit's message has the line `Deploy-Without-Backup: yes`. A first
      # deploy, before the hostname is bound, has nothing to back up yet (scripts/backup-check.ts).
      - name: Check a Backup from the last day exists
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          # Read whole, so a stack with no outputs yet is a first deploy and a failure stops here.
          outputs="$(pulumi stack output --cwd infra --json)"
          if [ "$(jq -r '.hostnameBound // false' <<< "$outputs")" != "true" ]; then
            echo "A first deploy: no Backup to look for yet."
            exit 0
          fi
          due="$(bun scripts/backup-check.ts due)"
          account="$(pulumi stack output --cwd infra cloudflareAccountId --show-secrets)"
          jurisdiction="$(pulumi stack output --cwd infra workerVars --show-secrets --json | jq -r '.JURISDICTION')"
          found="$RUNNER_TEMP/backup.zip"
          trap 'rm -f "$found"' EXIT
          if (cd apps/worker && CLOUDFLARE_ACCOUNT_ID="$account" bunx wrangler r2 object get \
            "praxis-backups/$due" --remote ${jurisdiction:+--jurisdiction "$jurisdiction"} \
            --file "$found" > /dev/null 2>&1); then
            echo "The Backup $due is in the bucket."
          elif bun scripts/backup-check.ts overridden <<< "$HEAD_COMMIT_MESSAGE"; then
            echo "::warning::No Backup $due in the bucket: deploying without it, as the commit says."
          else
            echo "::error::No Backup $due in the bucket, and a deploy cannot be undone once an object wakes under it. Find out why the daily Backup failed (Settings shows the last one made) or make an Export, then push a commit whose message has the line 'Deploy-Without-Backup: yes' to deploy anyway (docs/deployment.md)."
            exit 1
          fi

      # A model with no price shipped with Praxis fails the deploy before anything changes (ADR 0017).
      - name: Check the model has a price
        run: |
          AGENT_MODEL="$(pulumi config get --cwd infra praxis:agentModel 2>/dev/null || true)" \
            bun apps/worker/scripts/check-model.ts

      # Fails before changing anything when the configuration names another jurisdiction than the
      # deployed Worker's (infra/jurisdiction.ts).
      - name: pulumi up
        run: pulumi up --cwd infra --yes --skip-preview

      # The Worker's code and its Durable Object classes, with the vars and secrets Pulumi gives.
      # Every var is set afresh; secrets are only added, so a key the configuration no longer has
      # is deleted: without the Agent's there is no Agent (ADR 0017), and without the push key no
      # Notification. The Backups' bucket is bound in the Deployment's jurisdiction, which only a
      # copy of wrangler.jsonc can say (scripts/deploy-config.ts).
      - name: wrangler deploy
        working-directory: apps/worker
        run: |
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          pulumi stack output --cwd ../../infra workerSecrets --show-secrets --json > "$secrets"
          account="$(pulumi stack output --cwd ../../infra cloudflareAccountId --show-secrets)"
          given="$(pulumi stack output --cwd ../../infra workerVars --show-secrets --json)"
          jq -r '.[] | select(length >= 4)' <<< "$given" |
            while IFS= read -r value; do echo "::add-mask::$value"; done
          # An empty var keeps wrangler.jsonc's, which is empty too. RELEASE names this commit, the
          # release an object stuck on its upgrade says it failed under (section 11).
          vars=(--var "RELEASE:${GITHUB_SHA::12}")
          while IFS= read -r pair; do vars+=(--var "$pair"); done < <(
            jq -r 'to_entries[] | select(.value != "") | "\(.key):\(.value)"' <<< "$given"
          )
          bun ../../scripts/deploy-config.ts "$(jq -r '.JURISDICTION' <<< "$given")"
          CLOUDFLARE_ACCOUNT_ID="$account" bunx wrangler deploy --config wrangler.deploy.json \
            --secrets-file "$secrets" "${vars[@]}"
          for name in AGENT_API_KEY VOICE_API_KEY PUSH_PRIVATE_KEY; do
            jq -e --arg name "$name" 'has($name)' "$secrets" > /dev/null && continue
            status="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$account/workers/scripts/praxis/secrets/$name")"
            case "$status" in
              200 | 404) ;;
              *) echo "::error::Could not delete $name from the Worker: HTTP $status"; exit 1 ;;
            esac
          done

      # The custom domain needs the Worker, so a new Deployment binds it after its first deploy.
      - name: Bind the hostname on a first deploy
        run: |
          if [ "$(pulumi stack output --cwd infra hostnameBound)" != "true" ]; then
            pulumi up --cwd infra --yes --skip-preview
          fi
