name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Biome
        run: bunx biome ci .
      - name: Typecheck
        run: bun run typecheck
      - name: Guards still fire (lint rules, the registry guard)
        run: bun run test:lint
      - name: Domain package (bun test)
        run: bun run test:domain
      - name: Context object (Vitest in workerd)
        run: bun run test:worker
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Browser journeys (Playwright, desktop and phone, each twice to catch a journey that needs a fresh server)
        run: bun run test:e2e:twice
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
