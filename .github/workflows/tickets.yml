name: Ticket closed

# Closing a ticket can leave a comment in master naming it, which fails CI's ticket check from
# then on, though nothing was pushed. This runs that check as the ticket closes and, while a
# comment names it, reopens it and says which: its work is not done, and a comment alone went
# unseen after the close twice. However it was closed, on GitHub's page or by an agent.

on:
  issues:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  placeholders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: No placeholder names a closed ticket
        id: check
        run: bun run check:tickets 2>&1 | tee "$RUNNER_TEMP/tickets.txt"
        shell: bash -o pipefail {0}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Reopen the ticket while a comment names it
        if: failure() && steps.check.outcome == 'failure'
        run: |
          # Only this ticket's comments: master may be red over another, which that one reopened.
          grep -F "names #$NUMBER," "$RUNNER_TEMP/tickets.txt" > "$RUNNER_TEMP/named.txt" || exit 0
          {
            echo "Reopened: comments on master still name this ticket, which fails CI until they are cleared:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/named.txt"
            echo '```'
            echo
            echo "Clear each one, as this ticket's work replaces it, then close it again."
          } > "$RUNNER_TEMP/comment.md"
          gh issue reopen "$NUMBER" --repo "$GITHUB_REPOSITORY"
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
