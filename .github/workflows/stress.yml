name: Journeys under load

# The browser journeys, many at once on the one Deployment they share, where a read and a write
# can answer out of order (#83, #85). By hand only: a race only this run finds is one a single
# person on their own Deployment rarely meets (docs/flaky-journeys.md).

on:
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e:stress
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
