# The settings a Praxis Deployment needs. Real values never go in this repo (section 12): keep them in
# a Pulumi ESC environment and point your stack at it. `bun run wizard` walks you through it, and
# docs/deployment.md says what each step does.
#
# 1. Create the ESC environment (such as `<your-org>/praxis/production`) with this definition:
#
#    values:
#      pulumiConfig:
#        # Your Cloudflare account ID, and the zone and hostname Praxis is served at.
#        praxis:accountId: 0123456789abcdef0123456789abcdef
#        praxis:zone: example.com
#        praxis:hostname: praxis.example.com
#        # Your Zero Trust team domain (Zero Trust → Settings → Team name and domain).
#        praxis:accessTeamDomain: example.cloudflareaccess.com
#        # Your Google address, the only one that signs in: one address, no domain or list.
#        praxis:signInEmail: person@example.com
#        # A Google OAuth client for Access's Google login.
#        praxis:googleClientId: 000000000000-example.apps.googleusercontent.com
#        praxis:googleClientSecret:
#          fn::secret: GOCSPX-example
#        # Optional: the Agent's Anthropic API key (console.anthropic.com → API keys). Set a spend
#        # limit there too: it is the backstop behind Praxis's own cap. Without a key there is no
#        # Agent, and the rest of Praxis works as normal.
#        praxis:agentApiKey:
#          fn::secret: sk-ant-api03-example
#        # Optional: the Agent's model, one Praxis ships a price for; a deploy with any other fails.
#        # Without it, claude-sonnet-5-5.
#        # praxis:agentModel: claude-sonnet-5-5
#        # Optional: the voice provider's OpenAI API key (platform.openai.com → API keys), for a
#        # Call. What is said in a Call, and what the Agent answers, reaches OpenAI and whatever it
#        # keeps for its own monitoring. Without a key there is no way to start a Call.
#        praxis:voiceApiKey:
#          fn::secret: sk-proj-example
#        # The Web Push signing key pair, which `bun apps/worker/scripts/push-keys.ts` makes: the
#        # public key on its first line, the private key as a JWK on its second. Make it once and
#        # keep it: every browser's subscription is bound to it. Without it no Device gets a
#        # Notification.
#        praxis:pushPublicKey: BExamplePublicKey
#        praxis:pushPrivateKey:
#          fn::secret: '{"kty":"EC","crv":"P-256","x":"…","y":"…","d":"…"}'
#        # Optional, and chosen once: where every object is kept, and the daily Backups with them,
#        # "eu", "us" or "fedramp". Without it, wherever Cloudflare places them. A deploy that would change it fails: moving takes an
#        # Export restored into a new Deployment.
#        # praxis:jurisdiction: eu
#
# 2. The stack file then only imports it. CI writes this file on every deploy from the
#    PULUMI_ESC_ENVIRONMENT repository variable; locally, `pulumi config env add` writes it.
environment:
  - praxis/production
