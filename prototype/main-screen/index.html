<!doctype html>
<!--
  PROTOTYPE. Throwaway, never merged to master.

  Question (ticket "The main screen when conversation is primary"):
  what does the main screen look like when conversation and direct manipulation
  share it? Where do the Journal, the Task lists and the Agent sit on a phone
  and on a desktop?

  Four variants of the main screen, switchable via ?variant=A|B|C|D and
  ?device=phone|desktop (floating bar at the bottom, or the arrow keys).
  Run: open this file in a browser. All data is fake and lives in memory;
  writes are stubs that show the Effects a real tool call would report.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Praxis prototype: main screen</title>
<style>
:root{
  --bg:#f4f2ee; --panel:#fffdf9; --line:#ddd8cf; --ink:#1f1d1a; --mute:#77716a;
  --accent:#2f5d50; --agent:#eef1ea; --me:#e6ebf3; --warn:#a4541a; --held:#fff3d6;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#161513; --panel:#1f1e1b; --line:#38352f; --ink:#ece8e1; --mute:#9a938a;
    --accent:#7fb8a4; --agent:#262a24; --me:#252b36; --warn:#e0a064; --held:#3a3220; }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#8b8780;color:var(--ink);font:14px/1.45 system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
button.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
h3{font-size:12px;color:var(--mute);margin:12px 0 4px;font-weight:600}

/* device frame; .app is the container every variant's layout queries */
.frame{height:100vh;display:flex;align-items:center;justify-content:center}
.app{position:relative;overflow:hidden;background:var(--bg);container-type:inline-size;width:100%;height:100%;display:flex;flex-direction:column}
.frame.desktop{align-items:flex-start}
.frame.desktop .app{height:calc(100vh - 60px)}
.frame.tablet .app{width:900px}
.frame.phone .app{width:390px;height:min(780px,calc(100vh - 80px));border-radius:28px;border:8px solid #111}
@container (min-width:701px){ .ph{display:none!important} }
@container (max-width:700px){ .desk{display:none!important} }

/* atoms shared by all variants */
.top{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
.top .ctx{font-weight:600;border:none;padding:4px 6px}
.top .sp{flex:1}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;text-align:center}
.scroll{overflow:auto;flex:1;min-height:0;padding:10px 12px}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.task{display:flex;gap:8px;align-items:flex-start;padding:5px 0}
.task input{margin-top:3px}
.task .tt{display:block}
.task .why{display:block;font-size:12px;color:var(--mute)}
.task.Finished .tt{text-decoration:line-through;color:var(--mute)}
.task.Due .why{color:var(--warn)}
.entry{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.entry .meta{font-size:12px;color:var(--mute);margin-bottom:4px}
.entry .words{white-space:pre-wrap}
.entry .tasks{margin-top:6px;border-top:1px dashed var(--line);padding-top:4px}
.chip{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:0 8px;margin:6px 4px 0 0;color:var(--mute)}
.chip.heldchip{background:var(--held);color:var(--ink)}
.day{font-size:12px;color:var(--mute);text-align:center;margin:14px 0 4px}
.msg{max-width:85%;border-radius:12px;padding:8px 12px;margin:8px 0;background:var(--agent)}
.msg.me{background:var(--me);margin-left:auto}
.msg .who{font-size:11px;color:var(--mute);margin-bottom:2px}
.msg ul{margin:4px 0;padding-left:18px}
.fx{font-size:12px;color:var(--mute);margin-top:6px;border-left:2px solid var(--accent);padding-left:8px}
.held{background:var(--held);border:1px solid var(--warn);border-radius:8px;padding:8px 10px;margin-top:8px}
.held del{color:var(--mute)} .held ins{text-decoration:none;font-weight:600}
.held .row{display:flex;gap:8px;margin-top:8px}
.composer{flex:none;border-top:1px solid var(--line);background:var(--panel);padding:8px 12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{flex:1;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;resize:none;height:38px}
.composer .btns{display:flex;flex-direction:column;gap:4px}
.sheet{position:absolute;left:0;right:0;bottom:0;top:12%;background:var(--bg);border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:0 -8px 30px #0005;display:flex;flex-direction:column;z-index:5}
.sheet .top{border-radius:14px 14px 0 0}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 12px;border-radius:8px;font-size:12px;z-index:9;max-width:90%}
.body{flex:1;min-height:0;display:flex}

/* A: conversation is the screen, the rest is a rail (desktop) or sheets (phone) */
.vA .conv{flex:1;max-width:760px;margin:0 auto;width:100%}
.vA .rail{width:380px;border-left:1px solid var(--line)}
@container (max-width:700px){ .vA .rail{display:none} }

/* B: journal is the screen, tasks beside it, the Agent in a dock */
.vB .side{width:280px;border-right:1px solid var(--line)}
.vB .journal{flex:1}
.vB .journal .scroll{max-width:720px;width:100%;margin:0 auto}
.vB .dock{width:380px;border-left:1px solid var(--line);background:var(--bg)}
.vB .fab{position:absolute;right:16px;bottom:120px;border-radius:20px;padding:8px 14px;background:var(--accent);color:var(--panel);border:none;box-shadow:0 4px 14px #0004;z-index:4}
@container (max-width:700px){
  .vB .side{display:none}
  .vB .dock{position:absolute;left:0;right:0;bottom:0;top:12%;width:auto;border:none;border-radius:14px 14px 0 0;box-shadow:0 -8px 30px #0005;z-index:5}
}

/* C: three peers; columns on desktop, bottom tabs on phone */
.vC .body>.pane{flex:1;border-right:1px solid var(--line)}
.vC .body>.pane:first-child{flex:.8}
.vC .tabs{display:none}
.vC .colhead{padding:8px 12px 0}
.vC .attnbtn{display:none}
.vC .stale{font-size:12px;color:var(--warn);margin-top:4px}
.heldchip[data-act]{cursor:pointer}
/* in-between widths: Journal and Agent side by side, attention is a column you open */
@container (min-width:701px) and (max-width:1100px){
  .vC .attnbtn{display:inline-block}
  .vC .body>.p-today{display:none}
  .vC.attn-open .body>.p-today{display:flex;flex:none;width:280px}
}
@container (max-width:700px){
  .vC .body>.pane{display:none;border:none}
  .vC.tab-today .p-today,.vC.tab-journal .p-journal,.vC.tab-agent .p-agent{display:flex}
  .vC .tabs{display:flex;flex:none;border-top:1px solid var(--line);background:var(--panel)}
  .vC .tabs button{flex:1;border:none;border-radius:0;padding:10px 0}
  .vC .tabs button.on{background:none;color:var(--accent);font-weight:700}
}

/* D: one stream of Entries and Messages */
.vD .side{width:300px;border-right:1px solid var(--line)}
.vD .stream{flex:1}
.vD .stream .scroll{max-width:760px;width:100%;margin:0 auto}
.vD .msg{border:1px dashed var(--line);background:none}
.vD .msg.me{background:none}
.vD .strip{flex:none;border-bottom:1px solid var(--line);background:var(--panel);padding:6px 12px}
.vD .strip .scroll{max-height:220px;padding:0}
@container (max-width:700px){ .vD .side{display:none} }
@container (min-width:701px){ .vD .strip{display:none} }

/* the prototype switcher: not part of any design */
.switcher{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:99;display:flex;gap:6px;align-items:center;
  background:#111;color:#fff;border-radius:999px;padding:6px 10px;box-shadow:0 6px 20px #0008;font-size:13px;white-space:nowrap}
.switcher button{border-color:#555;color:#fff;border-radius:999px}
.switcher .lbl{min-width:210px;text-align:center}
</style>
</head>
<body>
<div class="frame" id="frame"><div class="app" id="app"></div></div>
<div class="switcher">
  <button data-sw="prev">←</button><span class="lbl" id="lbl"></span><button data-sw="next">→</button>
  <button data-sw="device" id="dev"></button>
</div>

<script>
// ---------- fake data: one Context, as view_attention and the list tools would return it ----------
const tasks = {
  t1:{title:'Send Q4 budget to Maria', state:'Due', why:'due today', group:'Due'},
  t6:{title:'Weekly report', state:'Due', why:'due tomorrow · repeats weekly', group:'Due'},
  t2:{title:'Book room for offsite', state:'Actionable', why:'became actionable: "Confirm offsite dates" finished yesterday', group:'Became actionable'},
  t5:{title:'Reply to Priya about onboarding', state:'Actionable', why:'no date', group:'Became actionable'},
  t3:{title:'Review vendor contract', state:'Delegated', why:'Delegated to Sam · quiet for 9 days', group:'Gone quiet'},
  t4:{title:'Publish hiring plan', state:'Waiting', why:'Waiting on "Send Q4 budget to Maria"', group:null},
  t7:{title:'Confirm offsite dates', state:'Finished', why:'finished yesterday', group:null},
};
const entries = [
  {id:'e0', t:1, day:'5 Nov', time:'10:15', author:'You', words:'Weekly report goes to the leadership list every Friday.', tasks:['t6'], links:[]},
  {id:'e2', t:2, day:'5 Nov', time:'16:40', author:'You', via:true, words:'Sam is taking the vendor contract review. Wants it back before the 20th.', tasks:['t3'], links:['@Sam']},
  {id:'e1', t:3, day:'Yesterday', time:'09:10', author:'You', words:'Offsite: dates confirmed with the venue, 14–15 Jan. Need to book the room next.', tasks:['t7','t2'], links:['▸ Offsite']},
  {id:'e3', t:5, day:'Today', time:'08:50', author:'You', words:"Maria needs the Q4 budget by end of day. Hiring plan can't go out until that's sent.", tasks:['t1','t4'], links:['@Maria','▸ Q4 planning']},
  {id:'e4', t:7, day:'Today', time:'09:02', author:'You', via:true, words:'Priya asked about onboarding again.', tasks:['t5'], links:['@Priya']},
];
const messages = [
  {id:'m1', t:4, day:'Today', time:'07:30', who:'agent', kind:'Brief', brief:['t1','t2','t3'], html:'Three things today:<ul><li><b>Send Q4 budget to Maria</b> is due.</li><li><b>Book room for offsite</b> became actionable when you confirmed the dates.</li><li>Sam has had <b>Review vendor contract</b> for 9 days with no word.</li></ul>'},
  {id:'m2', t:6, day:'Today', time:'09:02', who:'me', html:'priya asked about onboarding again, remind me to reply. also the offsite is 15–16 Jan not 14–15, fix that note'},
  {id:'m3', t:8, day:'Today', time:'09:02', who:'agent', html:"Recorded what you said about Priya and made a Task. The offsite dates are in your own words, so that change is waiting for your tap.",
    fx:['Entry recorded: "Priya asked about onboarding again."','Task made: Reply to Priya about onboarding','Mention added: Priya'], held:'h1'},
];
let held = {h1:{entry:'e1', before:'14–15 Jan', after:'15–16 Jan'}};
const projects = ['Q4 planning (2 open)','Offsite (1 open)'];

// ---------- prototype state ----------
const VARIANTS = {A:'Conversation is the screen', B:'Journal is the screen', C:'Three peers', D:'One stream'};
const q = new URLSearchParams(location.search);
let variant = VARIANTS[q.get('variant')] ? q.get('variant') : 'A';
const DEVICES = ['desktop','tablet','phone'];
let device = DEVICES.includes(q.get('device')) ? q.get('device') : 'desktop';
const ui = {sheet:null, dock:false, tab:'today', unread:true, attn:false, filter:'all', strip:false, toast:null};
let clock = 100;

// ---------- atoms ----------
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const taskRow = id => { const t = tasks[id]; return `<label class="task ${t.state}">
  <input type="checkbox" data-act="finish" data-id="${id}" ${t.state==='Finished'?'checked':''}>
  <span><span class="tt">${t.title}</span><span class="why">${t.why}</span></span></label>`; };
const heldFor = eid => Object.keys(held).find(h => held[h].entry === eid);
const entryCard = e => `<div class="entry">
  <div class="meta">${e.time} · ${e.author}${e.via?' · through Conversation':''}</div>
  <div class="words">${esc(e.words)}</div>
  ${e.links.map(l=>`<span class="chip">${l}</span>`).join('')}
  ${heldFor(e.id)?'<span class="chip heldchip" data-act="tab" data-id="today">Held Change waiting</span>':''}
  ${e.tasks.length?`<div class="tasks">${e.tasks.map(taskRow).join('')}</div>`:''}</div>`;
const heldCard = h => { const c = held[h]; if(!c) return ''; const e = entries.find(x=>x.id===c.entry);
  return `<div class="held"><b>Held Change</b> to your Entry of ${e.day.toLowerCase()} ${e.time}
    <div>${esc(e.words).replace(c.before, `<del>${c.before}</del> <ins>${c.after}</ins>`)}</div>
    <div class="row"><button class="primary" data-act="make" data-id="${h}">Make change</button><button data-act="cancel" data-id="${h}">Cancel</button></div></div>`; };
// C only: the Brief is a reading taken at one moment; say so once the live list has moved on
const stale = m => { const n = m.brief.filter(i=>tasks[i].state==='Finished').length;
  return `<div class="stale">As of ${m.time}.${n?` Since then ${n} of these ${n>1?'were':'was'} finished; Today has the live list.`:''}</div>`; };
const msg = m => `<div class="msg ${m.who==='me'?'me':''}">
  <div class="who">${m.who==='me'?'You':'Agent'}${m.kind?' · '+m.kind:''} · ${m.time}</div>${m.html}
  ${variant==='C'&&m.brief?stale(m):''}${m.fx?`<div class="fx">${m.fx.join('<br>')}</div>`:''}${m.held?heldCard(m.held):''}</div>`;
const attention = () => { const n = Object.keys(held).length;
  return (n?`<h3>Held Changes</h3>${Object.keys(held).map(heldCard).join('')}`:'') +
    ['Due','Became actionable','Gone quiet'].map(g => { const ids = Object.keys(tasks).filter(i=>tasks[i].group===g && tasks[i].state!=='Finished');
      return ids.length?`<h3>${g}</h3>${ids.map(taskRow).join('')}`:''; }).join(''); };
const attnCount = () => Object.values(tasks).filter(t=>t.group && t.state!=='Finished').length + Object.keys(held).length;
const byDay = (items, render) => { let d=null; return items.sort((a,b)=>a.t-b.t).map(i => (i.day!==d ? `<div class="day">${d=i.day}</div>` : '') + render(i)).join(''); };
const journal = () => byDay([...entries], entryCard);
const conversation = () => byDay([...messages], msg);
// modes: which sends the composer offers, first one is the primary
const composer = (modes, ph) => `<div class="composer"><textarea placeholder="${ph}"></textarea><div class="btns">
  ${modes.map((m,i)=>`<button class="${i?'':'primary'}" data-act="send" data-mode="${m}">${m==='ask'?'Ask Agent':'Record Entry'}</button>`).join('')}</div></div>`;
const topBar = extra => `<div class="top"><button class="ctx" title="Context">Work ▾</button><span class="sp"></span>${extra||''}</div>`;
const sheet = (title, inner) => `<div class="sheet ph"><div class="top"><b>${title}</b><span class="sp"></span><button data-act="sheet" data-id="">Close</button></div>${inner}</div>`;

// ---------- variants: each owns its whole layout ----------
const V = {
  // A. The Conversation fills the screen and its composer talks to the Agent.
  //    Desktop: attention and Journal in a right rail. Phone: both are sheets over the Conversation.
  A: () => `<div class="pane vA" style="flex:1">
    ${topBar(`<button class="ph" data-act="sheet" data-id="today">Today <span class="badge">${attnCount()}</span></button><button class="ph" data-act="sheet" data-id="journal">Journal</button>`)}
    <div class="body">
      <div class="pane conv"><div class="scroll" data-bottom>${conversation()}</div>${composer(['ask','record'],'Talk to the Agent…')}</div>
      <div class="pane rail"><div class="scroll"><h2>Needs attention</h2>${attention()}<h2>Journal</h2>${journal()}</div></div>
    </div>
    ${ui.sheet==='today'?sheet('Needs attention',`<div class="scroll">${attention()}</div>`):''}
    ${ui.sheet==='journal'?sheet('Journal',`<div class="scroll" data-bottom>${journal()}</div>`):''}
  </div>`,

  // B. The Journal fills the screen and its composer records an Entry with no model turn.
  //    Tasks sit beside it (desktop) or in a sheet (phone). The Agent is a dock you open.
  B: () => `<div class="pane vB" style="flex:1">
    ${topBar(`<button class="ph" data-act="sheet" data-id="today">Tasks <span class="badge">${attnCount()}</span></button><button class="desk ${ui.dock?'on':''}" data-act="dock">Agent</button>`)}
    <div class="body">
      <div class="pane side"><div class="scroll"><h2>Needs attention</h2>${attention()}<h2>Projects</h2>${projects.map(p=>`<div class="task">${p}</div>`).join('')}</div></div>
      <div class="pane journal"><div class="scroll" data-bottom>${journal()}</div>${composer(['record','ask'],'Write an Entry…')}</div>
      ${ui.dock?`<div class="pane dock"><div class="top"><b>Agent</b><span class="sp"></span><button data-act="dock">Close</button></div>
        <div class="scroll" data-bottom>${conversation()}</div>${composer(['ask'],'Talk to the Agent…')}</div>`:''}
    </div>
    ${ui.dock?'':`<button class="fab ph" data-act="dock">Agent${Object.keys(held).length?' · 1 held':''}</button>`}
    ${ui.sheet==='today'?sheet('Tasks',`<div class="scroll">${attention()}<h2>Projects</h2>${projects.map(p=>`<div class="task">${p}</div>`).join('')}</div>`):''}
  </div>`,

  // C. Attention, Journal and Conversation are equals. Three columns on a desktop,
  //    three bottom tabs on a phone. Each pane has its own composer; no mode to choose.
  C: () => `<div class="pane vC tab-${ui.tab} ${ui.attn?'attn-open':''}" style="flex:1">
    ${topBar(`<button class="attnbtn ${ui.attn?'on':''}" data-act="attn">Needs attention <span class="badge">${attnCount()}</span></button>`)}
    <div class="body">
      <div class="pane p-today"><div class="colhead desk"><h2>Needs attention</h2></div><div class="scroll">${attention()}<h2>Projects</h2>${projects.map(p=>`<div class="task">${p}</div>`).join('')}</div></div>
      <div class="pane p-journal"><div class="colhead desk"><h2>Journal</h2></div><div class="scroll" data-bottom>${journal()}</div>${composer(['record'],'Write an Entry…')}</div>
      <div class="pane p-agent"><div class="colhead desk"><h2>Agent</h2></div><div class="scroll" data-bottom>${conversation()}</div>${composer(['ask'],'Talk to the Agent…')}</div>
    </div>
    <div class="tabs">${[['today',`Today <span class="badge">${attnCount()}</span>`],['journal','Journal'],['agent',`Agent${ui.unread?' <span class="badge">1</span>':''}`]].map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-id="${k}">${l}</button>`).join('')}</div>
  </div>`,

  // D. One stream in time order: Entries are solid cards that are kept, Messages are
  //    dashed and are not. One composer with two sends. Attention is a rail or a strip.
  D: () => { const items = [...(ui.filter!=='conv'?entries:[]), ...(ui.filter!=='journal'?messages:[])];
    return `<div class="pane vD" style="flex:1">
    ${topBar([['all','All'],['journal','Journal'],['conv','Conversation']].map(([k,l])=>`<button class="${ui.filter===k?'on':''}" data-act="filter" data-id="${k}">${l}</button>`).join(''))}
    <div class="body">
      <div class="pane side"><div class="scroll"><h2>Needs attention</h2>${attention()}</div></div>
      <div class="pane stream">
        <div class="strip"><button data-act="strip">${attnCount()} need attention ${ui.strip?'▴':'▾'}</button>${ui.strip?`<div class="scroll">${attention()}</div>`:''}</div>
        <div class="scroll" data-bottom>${byDay(items, i => i.who ? msg(i) : entryCard(i))}</div>
        ${composer(['record','ask'],'Write an Entry, or ask the Agent…')}
      </div>
    </div></div>`; },
};

// ---------- render and stub writes ----------
const app = document.getElementById('app');
function render(){
  document.getElementById('frame').className = 'frame ' + device;
  app.innerHTML = V[variant]() + (ui.toast?`<div class="toast">${ui.toast}</div>`:'');
  app.querySelectorAll('[data-bottom]').forEach(el => el.scrollTop = el.scrollHeight);
  document.getElementById('lbl').textContent = `${variant} (${VARIANTS[variant]})`;
  document.getElementById('dev').textContent = device[0].toUpperCase() + device.slice(1);
  history.replaceState(null, '', `?variant=${variant}&device=${device}`);
}
function toast(t){ ui.toast = t; clearTimeout(toast.h); toast.h = setTimeout(()=>{ui.toast=null;render();}, 4000); }
const now = () => ({t:++clock, day:'Today', time:new Date().toTimeString().slice(0,5)});

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if(!b) return;
  const {act, id, mode} = b.dataset;
  if(act==='finish'){ const t = tasks[id]; const done = t.state!=='Finished';
    if(done){ t.prev = [t.state,t.why]; t.state='Finished'; t.why='finished just now'; } else { [t.state,t.why] = t.prev||['Actionable','reopened']; }
    let fx = 'no other Effects';
    if(id==='t1' && done){ Object.assign(tasks.t4,{state:'Actionable',why:'became actionable: "Send Q4 budget to Maria" finished',group:'Became actionable'}); fx='Effect by rule: "Publish hiring plan" became actionable'; }
    toast(`${done?'finish_task':'reopen_task'} · ${fx}`); }
  if(act==='make'){ const c = held[id]; const e = entries.find(x=>x.id===c.entry); e.words = e.words.replace(c.before,c.after); delete held[id]; toast('make_held_change · Entry changed, earlier version kept'); }
  if(act==='cancel'){ delete held[id]; toast('cancel_held_change · no Effects'); }
  if(act==='send'){ const ta = b.closest('.composer').querySelector('textarea'); const text = ta.value.trim(); if(!text) return;
    if(mode==='record'){ entries.push({id:'e'+clock, ...now(), author:'You', words:text, tasks:[], links:[]}); toast('record_entry · Entry recorded, no model turn'); }
    else { messages.push({id:'m'+clock, ...now(), who:'me', html:esc(text)});
      messages.push({id:'r'+clock, ...now(), who:'agent', html:'<i>(stub) The Agent would answer here, act at once, and list the Effects of what it did.</i>'});
      if(variant==='B') ui.dock = true; } }
  if(act==='sheet') ui.sheet = id || null;
  if(act==='dock') ui.dock = !ui.dock;
  if(act==='tab'){ ui.tab = id; if(id==='agent') ui.unread = false; if(id==='today') ui.attn = true; }
  if(act==='attn') ui.attn = !ui.attn;
  if(act==='filter') ui.filter = id;
  if(act==='strip') ui.strip = !ui.strip;
  render();
});

// ---------- switcher ----------
const keys = Object.keys(VARIANTS);
function step(d){ variant = keys[(keys.indexOf(variant)+d+keys.length)%keys.length]; ui.sheet=null; render(); }
document.querySelector('.switcher').addEventListener('click', ev => {
  const s = ev.target.dataset.sw; if(!s) return;
  if(s==='device'){ device = DEVICES[(DEVICES.indexOf(device)+1)%3]; render(); } else step(s==='prev'?-1:1);
});
document.addEventListener('keydown', ev => {
  if(ev.target.closest('input,textarea,[contenteditable]')) return;
  if(ev.key==='ArrowLeft') step(-1); if(ev.key==='ArrowRight') step(1);
});
render();
</script>
